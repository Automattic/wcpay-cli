name: CI

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    docs:
        name: Docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run docs:check
            - run: npm run release:check
            - run: npm run site:build

    unit-tests:
        name: Unit tests (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
                os: [ubuntu-latest]
                include:
                    - node: 22
                      os: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run test:coverage

    package-smoke:
        name: Package smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run install:smoke
