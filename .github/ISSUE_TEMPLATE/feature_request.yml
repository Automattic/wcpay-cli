name: Feature request
description: Suggest a command or improvement.
labels: ['enhancement']
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed command or behavior
          description: If this wraps a REST endpoint, link or name it — see docs/endpoint-inventory.md.
