name: Bug report
description: Something in wcpay-cli is broken.
labels: ['bug']
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Include the command you ran and what you expected.
      validations:
          required: true
    - type: textarea
      id: doctor
      attributes:
          label: wcpay doctor output
          description: Paste the output of `wcpay doctor --json --redact` (it is safe to share).
          render: json
    - type: input
      id: version
      attributes:
          label: CLI version
          description: Output of `wcpay --version`.
      validations:
          required: true
    - type: input
      id: platform
      attributes:
          label: OS and Node version
